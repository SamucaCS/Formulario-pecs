<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Cadastro – Visitas e Apoio Presencial (PECs)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --accent: #22d3ee;
      --accent-2: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 16px
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans";
      background: linear-gradient(135deg, #0b1025 0%, #0f172a 40%, #0b2530 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px
    }

    .container {
      max-width: 980px;
      margin: 0 auto
    }

    header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    h1 {
      font-size: 1.35rem;
      margin: 0
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(0, 0, 0, .12));
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--radius);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
      margin-bottom: 16px
    }

    form {
      padding: 16px
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(12, 1fr)
    }

    .col-6 {
      grid-column: span 6
    }

    .col-3 {
      grid-column: span 3
    }

    .col-12 {
      grid-column: span 12
    }

    @media (max-width:860px) {

      .col-6,
      .col-3 {
        grid-column: span 12
      }
    }

    label {
      display: block;
      font-size: .88rem;
      color: var(--muted);
      margin: 2px 0 6px
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0b1226;
      border: 1px solid rgba(255, 255, 255, .1);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      outline: none
    }

    textarea {
      min-height: 70px;
      resize: vertical
    }

    .tema-outros {
      margin-top: 8px;
      display: none;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700
    }

    .btn-primary {
      background: var(--accent);
      color: #03222c
    }

    .btn-secondary {
      background: #0b1226;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .15)
    }

    .ok {
      display: none;
      margin: 10px 16px 18px;
      color: #10b981
    }

    .links {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 6px 0 18px
    }

    a.btn {
      display: inline-block;
      text-decoration: none
    }
  </style>
</head>

    function deviceType() {

    function setupSelectOutros(selectId, outrosInputId) {
      const select = document.getElementById(selectId);
      const outros = document.getElementById(outrosInputId);
      if (!select || !outros) return;

      function update() {
        if (select.value === 'Outros') {
          outros.style.display = 'block';
        } else {
          outros.style.display = 'none';
          outros.value = '';
        }
      }

      select.addEventListener('change', update);
      update();
    }

          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });

      const text = await res.text();
      if (!res.ok) {
        console.error('STATUS:', res.status);
        console.error('HEADERS:', Object.fromEntries(res.headers.entries()));
        console.error('BODY:', text);
        throw new Error(text || `HTTP ${res.status}`);
      }
      try { return JSON.parse(text); } catch { return text; }
    }

    function wireForm(formId, okId, okLinkId, tabName, prefixo) {
      const form = document.getElementById(formId);
      const link = document.getElementById(okLinkId);

      const resultsUrl = new URL('./resultado-ecc.html', window.location.href);
      resultsUrl.searchParams.set('tab', tabName);
      link.setAttribute('href', resultsUrl.pathname + resultsUrl.search);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);

        const temaSelect = (fd.get('tema_select') || '').toString().trim();
        const temaOutros = (fd.get('tema_outros') || '').toString().trim();
        const temaDireto = (fd.get('tema') || '').toString().trim();

        let temaFinal = '';
        if (temaSelect || temaOutros) {
          if (temaSelect === 'Outros' && temaOutros) {
            temaFinal = `Outros – ${temaOutros}`;
          } else {
            temaFinal = temaSelect || temaOutros;
          }
        } else {
          temaFinal = temaDireto;
        }

        const profSelect = (fd.get('professores_select') || '').toString().trim();
        const profOutros = (fd.get('professores_outros') || '').toString().trim();
        const profDireto = (fd.get('professores') || '').toString().trim();

        let pecFinal = '';
        if (profSelect || profOutros) {
          if (profSelect === 'Outros' && profOutros) {
            pecFinal = profOutros;
          } else {
            pecFinal = profSelect || profOutros;
          }
        } else {
          pecFinal = profDireto;
        }

        const payload = {
          school_id: null,
          school_name: (fd.get('escola') || '').toString().trim(),
          pec_name: pecFinal,
          supervisor_name: null,
          role: null,
          visit_date: (fd.get('data') || '').toString(), // YYYY-MM-DD
          period: null,
          activity_type: `${prefixo}: ${temaFinal}`,
          notes: (fd.get('obs') || '').toString().trim() || null,
          device: deviceType(),
          attachments: []
        };

        try {
          await enviar(payload);
          const ok = document.getElementById(okId);
          ok.style.display = 'block';
          link.focus();
          form.reset();
          setTimeout(() => {
            ok.style.display = 'none';
          }, 4000);
        } catch (err) {
          alert('Falha ao enviar: ' + err.message);
        }
      });
    }

    wireForm('form-visitas', 'ok-visitas', 'ok-link-visitas', 'visitas', 'Visita');
    wireForm('form-apoio', 'ok-apoio', 'ok-link-apoio', 'apoio', 'Apoio presencial');
  </script>
</body>
