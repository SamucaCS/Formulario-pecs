<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro – Visitas e Apoio Presencial (PECs)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --accent: #22d3ee;
      --accent-2: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 16px
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans";
      background: linear-gradient(135deg, #0b1025 0%, #0f172a 40%, #0b2530 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px
    }

    .container {
      max-width: 980px;
      margin: 0 auto
    }

    header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    h1 {
      font-size: 1.35rem;
      margin: 0
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(0, 0, 0, .12));
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--radius);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
      margin-bottom: 16px
    }

    form {
      padding: 16px
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(12, 1fr)
    }

    .col-6 {
      grid-column: span 6
    }

    .col-3 {
      grid-column: span 3
    }

    .col-12 {
      grid-column: span 12
    }

    @media (max-width:860px) {

      .col-6,
      .col-3 {
        grid-column: span 12
      }
    }

    label {
      display: block;
      font-size: .88rem;
      color: var(--muted);
      margin: 2px 0 6px
    }

    input,
    textarea {
      width: 100%;
      background: #0b1226;
      border: 1px solid rgba(255, 255, 255, .1);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      outline: none
    }

    textarea {
      min-height: 70px;
      resize: vertical
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700
    }

    .btn-primary {
      background: var(--accent);
      color: #03222c
    }

    .btn-secondary {
      background: #0b1226;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .15)
    }

    .ok {
      display: none;
      margin: 10px 16px 18px;
      color: #10b981
    }

    .links {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 6px 0 18px
    }

    a.btn {
      display: inline-block;
      text-decoration: none
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>Cadastro – Visitas e Apoio Presencial (PECs)</h1>
      <div class="links">
        <a class="btn btn-secondary" href="./resultado-ecc.html">Ver resultados</a>
      </div>
    </header>

    <!-- VISITAS -->
    <section class="card" aria-labelledby="titulo-visitas">
      <form id="form-visitas">
        <h2 id="titulo-visitas" style="margin:0 0 8px;font-size:1rem">Nova visita</h2>
        <div class="grid">
          <div class="col-6">
            <label for="v-prof">Professores PECs</label>
            <input id="v-prof" name="professores" type="text" placeholder="Ex.: Ana Silva; João Santos" required />
          </div>
          <div class="col-3">
            <label for="v-data">Data</label>
            <input id="v-data" name="data" type="date" required />
          </div>
          <div class="col-3">
            <label for="v-escola">Escola</label>
            <input id="v-escola" name="escola" type="text" placeholder="Ex.: E.E. Alberto Santos" required />
          </div>
          <div class="col-12">
            <label for="v-tema">Tema Abordado</label>
            <input id="v-tema" name="tema" type="text" placeholder="Ex.: Avaliação diagnóstica; Planejamento de aula"
              required />
          </div>
          <div class="col-12">
            <label for="v-obs">Observações (opcional)</label>
            <textarea id="v-obs" name="obs"
              placeholder="Registre detalhes importantes, encaminhamentos, responsáveis, etc."></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary">Adicionar visita</button>
          <button type="reset" class="btn-secondary">Limpar</button>
        </div>
        <p class="ok" id="ok-visitas">✓ Visita salva.
          <a id="ok-link-visitas" class="btn btn-secondary" href="./resultado-ecc.html?tab=visitas">Ver resultados</a>
        </p>
      </form>
    </section>

    <!-- APOIO PRESENCIAL -->
    <section class="card" aria-labelledby="titulo-apoio">
      <form id="form-apoio">
        <h2 id="titulo-apoio" style="margin:0 0 8px;font-size:1rem">Novo apoio presencial</h2>
        <div class="grid">
          <div class="col-6">
            <label for="a-prof">Professores PECs</label>
            <input id="a-prof" name="professores" type="text" placeholder="Ex.: Ana Silva; João Santos" required />
          </div>
          <div class="col-3">
            <label for="a-data">Data</label>
            <input id="a-data" name="data" type="date" required />
          </div>
          <div class="col-3">
            <label for="a-escola">Escola</label>
            <input id="a-escola" name="escola" type="text" placeholder="Ex.: E.E. Alberto Santos" required />
          </div>
          <div class="col-12">
            <label for="a-tema">Componente</label>
            <input id="a-tema" name="tema" type="text" placeholder="Ex.: Tecnologias educativas; Apoio em sala"
              required />
          </div>
          <div class="col-12">
            <label for="a-obs">Observações (opcional)</label>
            <textarea id="a-obs" name="obs"
              placeholder="Detalhes do apoio presencial, responsáveis, encaminhamentos, etc."></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary">Adicionar apoio</button>
          <button type="reset" class="btn-secondary">Limpar</button>
        </div>
        <p class="ok" id="ok-apoio">✓ Apoio salvo.
          <a id="ok-link-apoio" class="btn btn-secondary" href="./resultado-ecc.html?tab=apoio">Ver resultados</a>
        </p>
      </form>
    </section>
  </div>

  <script>
    // === Config Supabase (seu projeto)
    const SUPABASE_URL = 'https://xdaanjevbvgqwasjqcew.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkYWFuamV2YnZncXdhc2pxY2V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwMDY4NDEsImV4cCI6MjA3NzU4Mjg0MX0.Pf-o3Wa9dLswwd4O8QFcH2v6oXHbvsSXrjIKJMUOz7E';

    function deviceType() { return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'mobile' : 'desktop'; }

    // ====== ENVIO COM LOG DETALHADO ======
    async function enviar(payload) {
      console.log('Payload enviado:', payload); // << vê exatamente o JSON
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pec_submissions`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });

      const text = await res.text();
      if (!res.ok) {
        console.error('STATUS:', res.status);
        console.error('HEADERS:', Object.fromEntries(res.headers.entries()));
        console.error('BODY:', text);
        throw new Error(text || `HTTP ${res.status}`);
      }
      try { return JSON.parse(text); } catch { return text; }
    }

    // ====== MONTA O PAYLOAD E ENVIA ======
    function wireForm(formId, okId, okLinkId, tabName, prefixo) {
      const form = document.getElementById(formId);
      const link = document.getElementById(okLinkId);

      const resultsUrl = new URL('./resultado-ecc.html', window.location.href);
      resultsUrl.searchParams.set('tab', tabName);
      link.setAttribute('href', resultsUrl.pathname + resultsUrl.search);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);

        const payload = {
          school_id: null,
          school_name: (fd.get('escola') || '').toString().trim(),
          pec_name: (fd.get('professores') || '').toString().trim(),
          supervisor_name: null,
          role: null,
          visit_date: (fd.get('data') || '').toString(),     // YYYY-MM-DD
          period: null,                                    // opcional
          activity_type: `${prefixo}: ${(fd.get('tema') || '').toString().trim()}`,
          notes: (fd.get('obs') || '').toString().trim() || null,
          device: deviceType(),
          attachments: []
        };

        try {
          await enviar(payload);
          const ok = document.getElementById(okId);
          ok.style.display = 'block';
          link.focus();
          form.reset();
          setTimeout(() => ok.style.display = 'none', 4000);
        } catch (err) {
          alert('Falha ao enviar: ' + err.message);
        }
      });
    }

    wireForm('form-visitas', 'ok-visitas', 'ok-link-visitas', 'visitas', 'Visita');
    wireForm('form-apoio', 'ok-apoio', 'ok-link-apoio', 'apoio', 'Apoio presencial');
  </script>
</body>

</html>
